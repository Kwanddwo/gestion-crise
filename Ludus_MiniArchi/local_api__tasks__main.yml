- name: Installer nginx, Python et psycopg2
  ansible.builtin.apt:
    name: [nginx, python3, python3-psycopg2]
    state: present
    update_cache: true

- name: Copier l application
  ansible.builtin.copy:
    src: api.py
    dest: /opt/api.py
    mode: "0755"

- name: Copier le service systemd
  ansible.builtin.copy:
    src: api.service
    dest: /etc/systemd/system/api.service

- name: Demarrer l application
  ansible.builtin.systemd:
    name: api
    daemon_reload: true
    enabled: true
    state: restarted

- name: Supprimer le site nginx par defaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Copier la conf nginx
  ansible.builtin.copy:
    src: api.conf
    dest: /etc/nginx/conf.d/api.conf

- name: Recharger nginx
  ansible.builtin.service:
    name: nginx
    state: restarted
    enabled: true
